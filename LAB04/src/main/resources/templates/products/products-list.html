<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Danh Sách Sản Phẩm</title>
</head>
<body>
    <div layout:fragment="content">
        
        <!-- Header trang -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Danh Sách Sản Phẩm</h3>
                <p class="text-muted small mb-0">Quản lý kho hàng, thông tin sản phẩm và giá bán</p>
            </div>
            <a th:href="@{/products/add}" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i> Thêm Sản Phẩm Mới
            </a>
        </div>

        <!-- Bảng Sản Phẩm -->
        <div class="card p-3">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Tên Sản Phẩm</th>
                            <th>Giá Bán</th>
                            <th>Danh Mục</th>
                            <th>Mô Tả</th>
                            <th class="text-end">Hành Động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${products}">
                            <td class="fw-bold text-secondary" th:text="'#' + ${p.id}">#1</td>
                            <td class="fw-semibold text-dark" th:text="${p.name}">Tên sản phẩm</td>
                            <td class="text-success fw-bold" 
                                th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">
                                10,000,000 VNĐ
                            </td>
                            <td>
                                <span class="badge badge-category px-2 py-1" 
                                      th:text="${p.category != null ? p.category.name : 'Chưa phân loại'}">
                                </span>
                            </td>
                            <td class="text-muted small" th:text="${p.description}">Mô tả ngắn...</td>
                            <td class="text-end">
                                <a th:href="@{/products/edit/{id}(id=${p.id})}" class="btn btn-sm btn-outline-warning me-1">
                                    <i class="bi bi-pencil-square"></i> Sửa
                                </a>
                                <a th:href="@{/products/delete/{id}(id=${p.id})}" class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('Xác nhận xóa sản phẩm này?')">
                                    <i class="bi bi-trash"></i> Xóa
                                </a>
                            </td>
                        </tr>
                        <!-- Trạng thái trống -->
                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="6" class="text-center py-5 text-muted">
                                <i class="bi bi-box-seam fs-1 d-block mb-2 text-secondary"></i>
                                Chưa có sản phẩm nào trong hệ thống.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</body>
</html>
