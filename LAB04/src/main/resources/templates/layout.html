<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Admin Store">Hệ Thống Quản Lý</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS tinh chỉnh -->
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        .navbar-brand { font-weight: 700; letter-spacing: -0.5px; }
        .card { border: none; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); border-radius: 0.75rem; }
        .table th { font-weight: 600; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px; color: #6c757d; }
        .btn { border-radius: 0.5rem; font-weight: 500; }
        .badge-category { background-color: #e0e7ff; color: #4338ca; font-weight: 600; }
    </style>
</head>
<body>

    <!-- THANH BAR DÙNG CHUNG (NAVBAR) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-2">
        <div class="container">
            <a class="navbar-brand text-primary-emphasis d-flex align-items-center gap-2" href="#">
                <i class="bi bi-box-seam-fill text-primary fs-4"></i>
                <span>StoreAdmin</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item">
                        <a class="nav-link px-3" th:href="@{/products}">
                            <i class="bi bi-grid-fill me-1"></i> Quản Lý Sản Phẩm
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" th:href="@{/categories}">
                            <i class="bi bi-tags-fill me-1"></i> Quản Lý Danh Mục
                        </a>
                    </li>
                </ul>

                <!-- TÁC VỤ NHANH -->
                <div class="d-flex gap-2">
                    <a th:href="@{/products/add}" class="btn btn-primary btn-sm d-flex align-items-center gap-1">
                        <i class="bi bi-plus-lg"></i> Thêm Sản Phẩm
                    </a>
                    <a th:href="@{/categories/add}" class="btn btn-outline-light btn-sm d-flex align-items-center gap-1">
                        <i class="bi bi-folder-plus"></i> Thêm Danh Mục
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- NỘI DUNG THAY ĐỔI THEO TỪNG TRANG -->
    <main class="container py-4" layout:fragment="content">
        <!-- Nội dung sẽ tự động chèn vào đây -->
    </main>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
